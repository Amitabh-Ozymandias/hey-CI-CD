name: Hello GitHub Actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Print message
        run: echo "Hello, from GitHub Actions!"

      - name: Show date
        run: date

      - name: Show operating system
        run: uname -a

  system-info:
    runs-on: ubuntu-latest

    steps:
      - name: Show hostname
        run: hostname

      - name: Show current user
        run: whoami

      - name: Show working directory
        run: pwd

  environment-info:
    runs-on: ubuntu-latest

    steps:
      - name: Show environment
        run: env

      - name: Show Git version
        run: git --version

      - name: Show Python version
        run: python3 --version